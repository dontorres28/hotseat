# Keeps the free Render service awake so visitors don't hit a cold start.
# Pings the health endpoint every 5 minutes. NOTE: this repo must be PUBLIC
# for GitHub Actions minutes to be free; GitHub also pauses scheduled runs
# after ~60 days with no commits. Update the URL if the deploy URL changes.
name: keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:         # lets you run it manually from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 30 https://hotseat-fix4.onrender.com/health || echo "ping failed (will retry next run)"
